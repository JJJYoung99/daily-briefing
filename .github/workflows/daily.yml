name: 매일 아침 브리핑

on:
  schedule:
    # GitHub 예약 실행은 정각에 몰려서 가끔 건너뛰어요. 그래서 정각을 피하고, 예비 실행을 두 번 더 둬요.
    - cron: "23 21 * * *"  # 06:23 KST (본 실행)
    - cron: "47 22 * * *"  # 07:47 KST (예비: 오늘 것이 없을 때만)
    - cron: "17 0 * * *"   # 09:17 KST (예비: 오늘 것이 없을 때만)
  push:                     # 클라우드 알람(Claude 루틴)이 trigger/ 폴더를 건드리면 실행
    paths: ["trigger/**"]
  workflow_dispatch:        # GitHub 앱/웹에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 오늘 브리핑이 이미 있는지 확인
        id: check
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "docs/archive/$(TZ=Asia/Seoul date +%Y-%m-%d).html" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "오늘 브리핑이 이미 있어서 건너뛰어요."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: 패키지 설치
        if: steps.check.outputs.skip != 'true'
        # 인터넷이 잠깐 끊겨도 3번까지 다시 받아요. 끝내 실패해도 멈추지 않고 '기본 브리핑'으로 넘어가요.
        run: |
          for i in 1 2 3; do
            pip install --retries 5 --timeout 60 "anthropic>=1,<2" && exit 0
            echo "설치 실패 ($i/3), 20초 뒤 다시 시도"; sleep 20
          done
          echo "::warning::anthropic 설치 실패: 기본 브리핑으로 만들어요."

      - name: 브리핑 만들기
        if: steps.check.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
        run: python scripts/build.py

      - name: 결과 저장 (GitHub Pages에 자동 반영)
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "daily-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 알람용 임시 브랜치 정리
        if: always() && startsWith(github.ref_name, 'trigger/')
        run: git push origin --delete "${{ github.ref_name }}" || true
