name: 매일 아침 브리핑

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 22:00 UTC = 한국 시간 아침 7시 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)
  workflow_dispatch:        # GitHub 앱/웹에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install "anthropic>=1,<2"

      - name: 브리핑 만들기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_MODEL: ${{ vars.BRIEFING_MODEL }}
        run: python scripts/build.py

      - name: 결과 저장 (GitHub Pages에 자동 반영)
        run: |
          git config user.name "daily-briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
